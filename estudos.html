<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071a33"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'"><title>Ciclo e Leitura • PRF</title><style>*{box-sizing:border-box}body{margin:0;background:#020b17;color:#fff;font:15px system-ui}.app{max-width:560px;margin:auto;min-height:100vh;background:#061a33;padding-bottom:75px}.top{position:sticky;top:0;z-index:4;padding:14px 16px;background:#061a33f5;border-bottom:1px solid #234667}.top b{color:#ffd52e}.tabs,.bulk{display:flex;gap:8px;margin-top:12px}.tabs button,.bulk button{flex:1;border:1px solid #24517c;background:#0b2848;color:#b9c8da;padding:10px;border-radius:12px}.tabs button.on{background:#ffd52e;color:#07182e;font-weight:900}.page{padding:15px}.card{background:#0b2848;border:1px solid #24517c;border-radius:15px;padding:14px;margin:10px 0}.progress{height:10px;background:#07182e;border-radius:9px;overflow:hidden;margin:8px 0}.bar{height:100%;background:#ffd52e}.lesson{display:flex;align-items:center;gap:7px;padding:10px 0;border-top:1px solid #1d446b}.lesson .info{flex:1;min-width:0}.lesson small,.notice{color:#9eb2c8}.status{border:1px solid #24517c;background:#07182e;color:#fff;padding:8px;border-radius:10px;max-width:110px}.open,.offlineBtn{border:0;font-weight:900;padding:9px 10px;border-radius:10px}.open{background:#ffd52e;color:#07182e}.offlineBtn{background:#123b61;color:#fff}.offlineBtn.saved{background:#176344}.search{width:100%;padding:12px;border-radius:12px;border:1px solid #24517c;background:#07182e;color:#fff}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric strong{font-size:24px;display:block}.back{color:#75c9ff;text-decoration:none}.hidden{display:none}.reader{position:fixed;inset:0;z-index:50;background:#020b17;display:none;flex-direction:column}.reader.on{display:flex}.readerbar{height:56px;display:flex;align-items:center;gap:10px;padding:8px 10px;background:#061a33;border-bottom:1px solid #234667}.readerbar b{flex:1}.readerbar button{border:0;border-radius:10px;padding:10px 13px;background:#ffd52e;color:#07182e;font-weight:900}.reader iframe{width:100%;flex:1;border:0;background:#fff}.offlineStatus{color:#7ee2a8}body.embedded .top{display:none}body.embedded .page{padding:8px 10px 80px}body.embedded .app{max-width:none;padding-bottom:0}@media(max-width:390px){.lesson{flex-wrap:wrap}.lesson .info{flex:1 1 100%}.status,.open,.offlineBtn{flex:1}}</style></head><body><div class="app"><header class="top"><a class="back" href="./">← Shorts</a> &nbsp; <b>PRF • ESTUDOS</b><div class="tabs"><button id="tc" class="on" onclick="showTab('cycle')">🔄 Ciclo</button><button id="tl" onclick="showTab('reading')">📖 Leitura</button></div></header><main class="page"><section id="cycle"><h2>🔄 Ciclo de Estudos</h2><div id="summary"></div><div id="cycleList"></div></section><section id="reading" class="hidden"><h2>📖 Leitura</h2><p class="notice">Baixe somente o que quiser usar sem internet. Os downloads são preservados nas atualizações do aplicativo.</p><div class="card"><b>Armazenamento offline</b><p id="offlineCount">Verificando…</p><div class="bulk"><button onclick="verifyOffline()">↻ Verificar</button><button onclick="removeAllOffline()">🗑 Remover downloads</button></div></div><input id="search" class="search" placeholder="Buscar disciplina ou aula" oninput="renderReading()"><div id="readingList"></div></section></main><div id="reader" class="reader"><div class="readerbar"><button onclick="closeReader()">← Voltar</button><b id="readerTitle">Leitura</b></div><iframe id="readerFrame"></iframe></div></div><script>const BASE='prf-leitura-pdfs/prf-leitura-pdfs/',DATA=[['Português',0,14],['Raciocínio Lógico-Matemática',0,19],['Informática',0,9],['Direito Constitucional',0,13],['Direito Administrativo',0,16],['Noções de Administração',0,16],['Legislação Relativa à Polícia Rodoviária Federal',1,2],['Ética e Conduta Pública',0,2],['Arquivologia',0,8]];let prog=JSON.parse(localStorage.getItem('prf-study-cycle')||'{}'),offline={};const key=(s,n)=>s+'|'+n,pad=n=>String(n).padStart(2,'0');function lessons(s,a,b){let x=[];for(let n=a;n<=b;n++)x.push({s,n,k:key(s,n),file:BASE+encodeURIComponent(s)+'/Aula%20'+pad(n)+'.pdf'});return x}const ALL=DATA.flatMap(d=>lessons(...d)),abs=l=>new URL(l.file,location.href).href;function save(){localStorage.setItem('prf-study-cycle',JSON.stringify(prog))}function state(k){return prog[k]||'todo'}function setState(k,v){prog[k]=v;save();renderCycle();renderReading()}function pct(a){let d=a.filter(x=>state(x.k)==='done').length;return{d,t:a.length,p:a.length?Math.round(d/a.length*100):0}}async function sw(){let r=await navigator.serviceWorker.ready;return navigator.serviceWorker.controller||r.active}async function verifyOffline(){if(!('serviceWorker'in navigator))return;let t=await sw();t.postMessage({type:'CHECK_READINGS',urls:ALL.map(abs)})}async function makeOffline(l){if(offline[l.k]){if(confirm('Remover esta aula do armazenamento offline?'))(await sw()).postMessage({type:'REMOVE_READING',url:abs(l)});return}if(!navigator.onLine){alert('Conecte-se à internet para baixar.');return}(await sw()).postMessage({type:'CACHE_READING',url:abs(l)});alert('Download iniciado.')}async function removeAllOffline(){let saved=ALL.filter(l=>offline[l.k]);if(!saved.length)return;if(!confirm('Remover todas as '+saved.length+' aulas offline?'))return;let t=await sw();saved.forEach(l=>t.postMessage({type:'REMOVE_READING',url:abs(l)}))}navigator.serviceWorker&&navigator.serviceWorker.addEventListener('message',e=>{let d=e.data||{};if(d.type==='CHECK_READINGS_RESULT'){offline={};d.saved.forEach(u=>{let l=ALL.find(x=>abs(x)===u);if(l)offline[l.k]=true});renderReading();updateCount()}if(d.type==='CACHE_READING_RESULT'&&d.ok||d.type==='REMOVE_READING_RESULT'){verifyOffline()}});function updateCount(){let n=Object.keys(offline).length,el=document.getElementById('offlineCount');if(el)el.textContent=n+' aula'+(n===1?'':'s')+' disponível'+(n===1?'':'is')+' offline'}function openReader(l){if(!navigator.onLine&&!offline[l.k]){alert('Esta aula não está armazenada offline.');return}if(state(l.k)==='todo'){prog[l.k]='doing';save()}readerTitle.textContent='Aula '+pad(l.n)+' • '+l.s;readerFrame.src=l.file+'#toolbar=0&navpanes=0&view=FitH';reader.classList.add('on')}function closeReader(){reader.classList.remove('on');readerFrame.src='about:blank';renderReading()}function select(l){return '<select class="status" onchange="setState('+JSON.stringify(l.k)+',this.value)"><option value="todo" '+(state(l.k)==='todo'?'selected':'')+'>Não iniciada</option><option value="doing" '+(state(l.k)==='doing'?'selected':'')+'>Estudando</option><option value="done" '+(state(l.k)==='done'?'selected':'')+'>Concluída</option></select>'}function buttons(l){return '<button class="open" onclick=\'openReader('+JSON.stringify(l)+')\'>Ler</button><button class="offlineBtn '+(offline[l.k]?'saved':'')+'" onclick=\'makeOffline('+JSON.stringify(l)+')\'>'+(offline[l.k]?'✓ Offline':'⬇ Offline')+'</button>'}function renderCycle(){let p=pct(ALL);summary.innerHTML='<div class="summary"><div class="card metric"><strong>'+p.d+'/'+p.t+'</strong>aulas concluídas</div><div class="card metric"><strong>'+p.p+'%</strong>progresso</div></div>';cycleList.innerHTML=DATA.map(d=>{let a=lessons(...d),p=pct(a),n=a.find(x=>state(x.k)!=='done');return '<div class="card"><b>'+d[0]+'</b><div class="progress"><div class="bar" style="width:'+p.p+'%"></div></div><small>'+p.d+'/'+p.t+' concluídas</small>'+(n?'<div class="lesson"><div class="info">Próxima: Aula '+pad(n.n)+'</div>'+select(n)+'<button class="open" onclick=\'openReader('+JSON.stringify(n)+')\'>Ler</button></div>':'<p>✅ Concluída</p>')+'</div>'}).join('')}function renderReading(){let q=(search.value||'').toLowerCase();readingList.innerHTML=DATA.map(d=>{let a=lessons(...d).filter(l=>(l.s+' aula '+pad(l.n)).toLowerCase().includes(q));if(!a.length)return'';return '<div class="card"><b>'+d[0]+'</b>'+a.map(l=>'<div class="lesson"><div class="info"><b>Aula '+pad(l.n)+'</b><br><small>'+({todo:'Não iniciada',doing:'Estudando',done:'Concluída'}[state(l.k)])+(offline[l.k]?' • <span class="offlineStatus">offline ✓</span>':'')+'</small></div>'+select(l)+buttons(l)+'</div>').join('')+'</div>'}).join('');updateCount()}function showTab(t){cycle.classList.toggle('hidden',t!=='cycle');reading.classList.toggle('hidden',t!=='reading');tc.classList.toggle('on',t==='cycle');tl.classList.toggle('on',t==='reading');if(t==='reading'){renderReading();verifyOffline()}}function routeHash(){showTab(location.hash==='#reading'?'reading':'cycle')}if(self!==top)document.body.classList.add('embedded');addEventListener('hashchange',routeHash);renderCycle();renderReading();routeHash();verifyOffline();</script></body></html>
