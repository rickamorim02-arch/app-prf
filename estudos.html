<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071a33"><title>Ciclo e Leitura • PRF</title><style>*{box-sizing:border-box}body{margin:0;background:#020b17;color:#fff;font:15px system-ui}.app{max-width:560px;margin:auto;min-height:100vh;background:#061a33;padding-bottom:75px}.top{position:sticky;top:0;z-index:4;padding:14px 16px;background:#061a33f5;border-bottom:1px solid #234667}.top b{color:#ffd52e}.tabs{display:flex;gap:8px;margin-top:12px}.tabs button,.filter button{flex:1;border:1px solid #24517c;background:#0b2848;color:#b9c8da;padding:10px;border-radius:12px}.tabs button.on{background:#ffd52e;color:#07182e;font-weight:900}.page{padding:15px}.card{background:#0b2848;border:1px solid #24517c;border-radius:15px;padding:14px;margin:10px 0}.progress{height:10px;background:#07182e;border-radius:9px;overflow:hidden;margin:8px 0}.bar{height:100%;background:#ffd52e}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.lesson{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #1d446b}.lesson:first-of-type{border-top:0}.lesson .info{flex:1}.lesson small{color:#9eb2c8}.status{border:1px solid #24517c;background:#07182e;color:#fff;padding:8px;border-radius:10px}.open{display:inline-block;text-decoration:none;background:#ffd52e;color:#07182e;font-weight:900;padding:8px 10px;border-radius:10px}.done{opacity:.65}.search{width:100%;padding:12px;border-radius:12px;border:1px solid #24517c;background:#07182e;color:#fff}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric strong{font-size:24px;display:block}.back{color:#75c9ff;text-decoration:none}.hidden{display:none}</style></head><body><div class="app"><header class="top"><div><a class="back" href="./">← Shorts</a> &nbsp; <b>PRF • ESTUDOS</b></div><div class="tabs"><button id="tc" class="on" onclick="showTab('cycle')">🔄 Ciclo</button><button id="tl" onclick="showTab('reading')">📖 Leitura</button></div></header><main class="page"><section id="cycle"><h2>🔄 Ciclo de Estudos</h2><div id="summary"></div><p>Avance aula por aula. O ciclo preserva o seu progresso no aparelho.</p><div id="cycleList"></div></section><section id="reading" class="hidden"><h2>📖 Leitura</h2><p>Resumos oficiais em PDF das aulas. Arquivos Word e Discursiva foram ignorados.</p><input id="search" class="search" placeholder="Buscar disciplina ou aula" oninput="renderReading()"><div id="readingList"></div></section></main></div><script>
const BASE='prf-leitura-pdfs/prf-leitura-pdfs/';
const DATA=[
['Português',0,14],['Raciocínio Lógico-Matemática',0,19],['Informática',0,9],['Direito Constitucional',0,13],['Direito Administrativo',0,16],['Noções de Administração',0,16],['Legislação Relativa à Polícia Rodoviária Federal',1,2],['Ética e Conduta Pública',0,2],['Arquivologia',0,8]
];
let prog=JSON.parse(localStorage.getItem('prf-study-cycle')||'{}');
function key(s,n){return s+'|'+n}function pad(n){return String(n).padStart(2,'0')}function save(){localStorage.setItem('prf-study-cycle',JSON.stringify(prog))}
function lessons(s,a,b){let x=[];for(let n=a;n<=b;n++)x.push({s,n,k:key(s,n),file:BASE+encodeURIComponent(s)+'/Aula%20'+pad(n)+'.pdf'});return x}const ALL=DATA.flatMap(d=>lessons(...d));
function state(k){return prog[k]||'todo'}function setState(k,v){prog[k]=v;save();renderCycle();renderReading()}
function pct(list){let d=list.filter(x=>state(x.k)==='done').length;return {d,t:list.length,p:list.length?Math.round(d/list.length*100):0}}
function summary(){let p=pct(ALL);document.getElementById('summary').innerHTML='<div class="summary"><div class="card metric"><strong>'+p.d+'/'+p.t+'</strong>aulas concluídas</div><div class="card metric"><strong>'+p.p+'%</strong>progresso geral</div></div><div class="progress"><div class="bar" style="width:'+p.p+'%"></div></div>'}
function select(l){return '<select class="status" onchange="setState('+JSON.stringify(l.k)+',this.value)"><option value="todo" '+(state(l.k)==='todo'?'selected':'')+'>Não iniciada</option><option value="doing" '+(state(l.k)==='doing'?'selected':'')+'>Estudando</option><option value="done" '+(state(l.k)==='done'?'selected':'')+'>Concluída</option></select>'}
function renderCycle(){summary();document.getElementById('cycleList').innerHTML=DATA.map(d=>{let ls=lessons(...d),p=pct(ls);let next=ls.find(x=>state(x.k)!=='done');return '<div class="card"><b>'+d[0]+'</b><div class="progress"><div class="bar" style="width:'+p.p+'%"></div></div><small>'+p.d+'/'+p.t+' concluídas • '+p.p+'%</small>'+(next?'<div class="lesson"><div class="info"><b>Próxima: Aula '+pad(next.n)+'</b></div>'+select(next)+'<a class="open" href="'+next.file+'" target="_blank" onclick="if(state('+JSON.stringify(next.k)+')===\'todo\')setState('+JSON.stringify(next.k)+',\'doing\')">Ler</a></div>':'<p>✅ Disciplina concluída</p>')+'</div>'}).join('')}
function renderReading(){let q=(document.getElementById('search').value||'').toLowerCase();document.getElementById('readingList').innerHTML=DATA.map(d=>{let ls=lessons(...d).filter(l=>(l.s+' aula '+pad(l.n)).toLowerCase().includes(q));if(!ls.length)return '';let p=pct(lessons(...d));return '<div class="card"><b>'+d[0]+'</b><small> • '+p.d+'/'+p.t+' concluídas</small>'+ls.map(l=>'<div class="lesson '+(state(l.k)==='done'?'done':'')+'"><div class="info"><b>Aula '+pad(l.n)+'</b><br><small>'+({todo:'Não iniciada',doing:'Estudando',done:'Concluída'}[state(l.k)])+'</small></div>'+select(l)+'<a class="open" href="'+l.file+'" target="_blank" onclick="if(state('+JSON.stringify(l.k)+')===\'todo\')setState('+JSON.stringify(l.k)+',\'doing\')">PDF</a></div>').join('')+'</div>'}).join('')}
function showTab(t){document.getElementById('cycle').classList.toggle('hidden',t!=='cycle');document.getElementById('reading').classList.toggle('hidden',t!=='reading');document.getElementById('tc').classList.toggle('on',t==='cycle');document.getElementById('tl').classList.toggle('on',t==='reading');if(t==='reading')renderReading()}
function routeHash(){if(location.hash==='#reading')showTab('reading');else showTab('cycle')}
window.addEventListener('hashchange',routeHash);
renderCycle();renderReading();routeHash();
</script></body></html>
