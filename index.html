<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071a33"><link rel="manifest" href="manifest.webmanifest"><title>Concurso Shorts PRF</title><style>*{box-sizing:border-box}body{margin:0;background:#020b17;color:#fff;font:15px system-ui}.app{max-width:560px;margin:auto;min-height:100vh;background:#061a33}.top{position:fixed;z-index:5;top:0;width:min(560px,100%);padding:12px 15px;background:#061a33ee}.top b,.letter{color:#ffd52e}.feed{height:100vh;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y proximity;scroll-behavior:auto;background:#061a33}.q{min-height:100vh;scroll-snap-align:start;scroll-snap-stop:normal;padding:100px 18px 90px;display:flex;flex-direction:column;justify-content:center;background:#061a33}.intro{min-height:auto;padding-top:105px;padding-bottom:30px;scroll-snap-align:none}.tag{color:#75c9ff;font-weight:800;font-size:12px}.topic{color:#aabbd0;margin:6px 0 18px}.q h1{font-size:23px;line-height:1.3}.choice{position:relative;margin:6px 0}.choice input[type=radio]{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:22px;height:22px;margin:0;accent-color:#ffd52e;z-index:2}.opt{display:block;border:1px solid #24517c;background:#0b2848;color:#fff;padding:14px 14px 14px 48px;border-radius:14px;min-height:52px}.choice input:checked+.opt{outline:3px solid #ffd52e;outline-offset:2px}.reveal{position:absolute;opacity:0;pointer-events:none}.resolve{display:block;width:100%;padding:14px;margin-top:12px;border-radius:14px;background:#ffd52e;color:#07182e;font-weight:900;text-align:center;cursor:pointer}.feedback{display:none;margin-top:12px;background:#0d2948;padding:14px;border-radius:14px}.reveal:checked~.feedback{display:block}.reveal:checked~.choice.correct .opt{background:#0d6b46;border:2px solid #43e09d}.reveal:checked~.choice:not(.correct) input:checked+.opt{background:#7a2635;border:2px solid #ff7188}.reveal:checked~.resolve{display:none}.letter{font-weight:900}.star{background:none;border:0;color:#ffd52e;margin-top:12px;padding:12px}.feedfilter{position:fixed;z-index:4;top:44px;width:min(560px,100%);display:flex;gap:6px;padding:7px 12px;background:#061a33ee}.feedfilter button{flex:1;border:1px solid #24517c;background:#0b2848;color:#aabbd0;padding:8px 4px;border-radius:10px}.feedfilter button.on,button.primary{background:#ffd52e;color:#07182e;font-weight:900}.panel{padding:75px 16px 85px}.hidden{display:none}.card{background:#0b2848;border:1px solid #24517c;padding:14px;margin:10px 0;border-radius:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric strong{font-size:24px;display:block}button.primary{width:100%;padding:14px;border:0;border-radius:14px}input:not([type=radio]),select{width:100%;padding:12px;background:#07182e;border:1px solid #24517c;color:#fff;margin:5px 0 10px;border-radius:14px}nav{position:fixed;z-index:6;bottom:0;width:min(560px,100%);display:flex;justify-content:space-around;background:#061a33f5;border-top:1px solid #234667;padding:8px}nav button{background:none;border:0;color:#aabbd0;font-size:11px}nav button.on{color:#fff}.reaction{font-size:48px;text-align:center;margin:8px}.studyEmbed{height:calc(100vh - 155px);margin:0 -14px -14px}.studyEmbed iframe{width:100%;height:100%;border:0;background:#061a33}</style></head><body><div class="app"><div class="top"><b>CONCURSO SHORTS PRF</b></div><div id="feedFilter" class="feedfilter"><button id="fp" class="on" onclick="setFeedMode('pending')">⏳ A resolver</button><button id="fr" onclick="setFeedMode('resolved')">✅ Resolvidas</button><button id="fa" onclick="setFeedMode('all')">📚 Todas</button></div><main id="feed" class="feed"></main><section id="subjects" class="panel hidden"><h2>📚 Matérias</h2><input id="find" placeholder="Buscar matéria"><div id="sl"></div></section><section id="stats" class="panel hidden"><h2>📊 Desempenho</h2><div class="grid"><div class="card metric"><strong id="an">0</strong>respondidas</div><div class="card metric"><strong id="ac">0</strong>acertos</div><div class="card metric"><strong id="rt">0%</strong>aproveitamento</div><div class="card metric"><strong id="fv">0</strong>favoritas</div></div><div class="card" id="bs"></div></section><section id="cycle" class="panel hidden"><h2>🔄 Ciclo de Estudos</h2><div class="card"><div class="studyEmbed"><iframe src="estudos.html#cycle" title="Ciclo de Estudos"></iframe></div></div></section><section id="reading" class="panel hidden"><h2>📖 Leitura</h2><div class="card"><div class="studyEmbed"><iframe src="estudos.html#reading" title="Leitura"></iframe></div></div></section><section id="more" class="panel hidden"><h2>☰ Mais</h2><div class="card"><h3>🎯 Simulado</h3><select id="simSelect"></select><button class="primary" id="simBtn">Começar</button></div><div class="card"><b>ℹ️ Referência</b><p>Aplicativo de estudo para PRF Administrativo. Confira sempre o edital oficial vigente.</p></div></section><nav><button data-tab="feed" class="on">🎬<br>Shorts</button><button data-tab="subjects">📚<br>Matérias</button><button data-tab="stats">📊<br>Desempenho</button><button data-tab="cycle">🔄<br>Ciclo</button><button data-tab="reading">📖<br>Leitura</button><button data-tab="more">☰<br>Mais</button></nav></div><script>'use strict';const S=['Língua Portuguesa','Ética e Conduta Pública','Raciocínio Lógico','Direito Constitucional','Direito Administrativo','Administração','Arquivologia','Informática','Legislação relativa à PRF'];const $=id=>document.getElementById(id);let feedMode='pending',st;try{st=JSON.parse(localStorage.getItem('prf-v2')||'null')}catch(e){}if(!st||typeof st!=='object')st={qs:[],ans:{},fav:{}};st.ans=st.ans||{};st.fav=st.fav||{};const save=()=>{try{localStorage.setItem('prf-v2',JSON.stringify(st))}catch(e){}};const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');const clean=v=>String(v??'').replace(/^\s*[A-E][\)\.\-:]?\s*/i,'').trim();const key=v=>String(v);const safe=v=>String(v).replace(/[^a-zA-Z0-9_-]/g,'_');async function init(){try{let r=await fetch('questoes.json?v=17-'+Date.now(),{cache:'no-store'}),d=await r.json();if(Array.isArray(d.questions))st.qs=d.questions}catch(e){console.warn(e)}save();render();more()}function current(){if(feedMode==='pending')return st.qs.filter(q=>!st.ans[key(q.id)]);if(feedMode==='resolved')return st.qs.filter(q=>!!st.ans[key(q.id)]);return st.qs}function answerText(q){let i='ABCDE'.indexOf(String(q.r||'').trim().charAt(0).toUpperCase());return i>=0&&q.o&&q.o[i]!=null?clean(q.o[i]):q.r}function render(list){let base=list||current();$('feed').innerHTML='<article class="q intro"><span class="tag">PRF • ADMINISTRATIVO</span><h1>🎯 Concurso Shorts PRF</h1><p>Marque uma alternativa e toque em Resolver e mostrar comentários.</p><div class="card"><b>'+st.qs.length+'</b> questões • 9 matérias</div></article>'+base.map(q=>{let id=key(q.id),s=safe(id),a=String(st.ans[id]||'').toUpperCase(),right=String(q.r||'').trim().charAt(0).toUpperCase(),rid='reveal_'+s;let choices=(q.o||[]).map((o,i)=>{let l=String.fromCharCode(65+i),cid='q_'+s+'_'+l;return '<div class="choice '+(l===right?'correct':'')+'"><input type="radio" id="'+cid+'" name="q_'+s+'" value="'+l+'" '+(a===l?'checked':'')+'><label class="opt" for="'+cid+'"><span class="letter">'+l+') </span>'+esc(clean(o))+'</label></div>'}).join('');let fb='<div class="feedback"><div class="reaction">'+(a&&a===right?'🎉 🥳 🎊':'📝')+'</div><b>Resposta correta: '+esc(answerText(q))+'</b><br><br><b>Comentário:</b> '+esc(q.e)+'</div>';return '<article class="q question" data-id="'+esc(id)+'"><span class="tag">'+esc(q.s)+'</span><div class="topic">'+esc(q.t)+'</div><h1>'+esc(q.q)+'</h1><input class="reveal" type="checkbox" id="'+rid+'" '+(a?'checked':'')+'>'+choices+'<label class="resolve" for="'+rid+'">Resolver e mostrar comentários</label>'+fb+'<button type="button" class="star" data-fav="'+esc(id)+'">'+(st.fav[id]?'★ Favorita':'☆ Favoritar')+'</button></article>'}).join('')}function setFeedMode(m){feedMode=m;['fp','fr','fa'].forEach(x=>$(x)?.classList.remove('on'));$(m==='pending'?'fp':m==='resolved'?'fr':'fa')?.classList.add('on');render()}$('feed').addEventListener('change',e=>{if(!e.target.classList.contains('reveal')||!e.target.checked)return;let card=e.target.closest('.question'),input=card?.querySelector('input[type=radio]:checked');if(!card||!input){e.target.checked=false;return}let id=key(card.dataset.id);if(!st.ans[id]){st.ans[id]=input.value;save()}card.querySelectorAll('input[type=radio]').forEach(r=>r.disabled=true);stats()});$('feed').addEventListener('click',e=>{let b=e.target.closest('[data-fav]');if(!b)return;let id=key(b.dataset.fav);st.fav[id]=!st.fav[id];save();b.textContent=st.fav[id]?'★ Favorita':'☆ Favoritar'});document.querySelector('nav').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b)tab(b.dataset.tab)});function tab(n){$('feedFilter').style.display=n==='feed'?'flex':'none';document.querySelectorAll('main,section').forEach(x=>x.classList.add('hidden'));$(n).classList.remove('hidden');document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.tab===n));if(n==='subjects')subjects();if(n==='stats')stats();if(n==='more')more()}function subjects(){let f=($('find').value||'').toLowerCase();$('sl').innerHTML=S.filter(s=>s.toLowerCase().includes(f)).map((s,i)=>{let q=st.qs.filter(x=>x.s===s),a=q.filter(x=>st.ans[key(x.id)]);return '<div class="card"><b>'+esc(s)+'</b><p>'+a.length+'/'+q.length+' respondidas</p><button class="primary" data-sub="'+i+'">Estudar</button></div>'}).join('')}$('find').addEventListener('input',subjects);$('sl').addEventListener('click',e=>{let b=e.target.closest('[data-sub]');if(!b)return;let s=S[+b.dataset.sub];tab('feed');render(st.qs.filter(q=>q.s===s))});function stats(){let ids=Object.keys(st.ans),c=ids.filter(id=>{let q=st.qs.find(x=>key(x.id)===id);return q&&String(st.ans[id]).toUpperCase()===String(q.r||'').trim().charAt(0).toUpperCase()});$('an').textContent=ids.length;$('ac').textContent=c.length;$('rt').textContent=ids.length?Math.round(c.length/ids.length*100)+'%':'0%';$('fv').textContent=Object.values(st.fav).filter(Boolean).length;$('bs').innerHTML='<h3>Por matéria</h3>'+S.map(s=>{let q=st.qs.filter(x=>x.s===s),a=q.filter(x=>st.ans[key(x.id)]);return a.length?'<p>'+esc(s)+': '+a.length+' respondidas</p>':''}).join('')}function more(){$('simSelect').innerHTML='<option value="">Todas</option>'+S.map(s=>'<option>'+esc(s)+'</option>').join('')}$('simBtn').addEventListener('click',()=>{let s=$('simSelect').value||'',q=st.qs.filter(x=>!s||x.s===s).sort(()=>Math.random()-.5).slice(0,10);tab('feed');render(q)});if('serviceWorker'in navigator)navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))).catch(()=>{});init();</script></body></html>
