<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071a33"><title>Concurso Shorts PRF</title><style>*{box-sizing:border-box}html,body{margin:0;background:#061a33;color:#fff;font:15px system-ui}.app{max-width:560px;margin:auto;min-height:100dvh;padding:126px 0 76px}.top{position:fixed;z-index:20;top:0;width:min(560px,100%);height:58px;padding:18px 15px;background:#061a33;border-bottom:1px solid #173b60}.top b,.letter{color:#ffd52e}.feedfilter{position:fixed;z-index:19;top:58px;width:min(560px,100%);height:68px;display:flex;align-items:center;gap:6px;padding:8px 12px;background:#061a33;border-bottom:1px solid #173b60}.feedfilter button{flex:1;border:1px solid #24517c;background:#0b2848;color:#aabbd0;padding:11px 4px;border-radius:12px}.feedfilter button.on,.primary{background:#ffd52e!important;color:#07182e!important;font-weight:900}.q{padding:24px 18px 30px;border-bottom:1px solid #173b60}.tag{color:#75c9ff;font-weight:800;font-size:12px}.topic{color:#aabbd0;margin:6px 0 18px}.q h1{font-size:23px;line-height:1.3}.choice{position:relative;margin:8px 0}.choice input{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:22px;height:22px;accent-color:#ffd52e}.opt{display:block;border:1px solid #24517c;background:#0b2848;padding:14px 14px 14px 48px;border-radius:14px;min-height:52px}.choice input:checked+.opt{outline:3px solid #ffd52e}.resolve{width:100%;padding:14px;margin-top:14px;border:0;border-radius:14px;background:#ffd52e;color:#07182e;font-weight:900}.feedback{display:none;margin-top:14px;background:#0d2948;padding:14px;border-radius:14px;line-height:1.45}.answered .feedback{display:block}.answered .correct .opt{background:#0d6b46;border:2px solid #43e09d}.answered .choice:not(.correct) input:checked+.opt{background:#7a2635;border:2px solid #ff7188}.answered .resolve{display:none}.letter{color:#ffd52e;font-weight:900}.star,.doubtBtn{background:none;border:0;color:#ffd52e;padding:12px}.panel{padding:18px 16px}.hidden{display:none!important}.card{background:#0b2848;border:1px solid #24517c;padding:14px;margin:10px 0;border-radius:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric strong{font-size:24px;display:block}.primary{width:100%;padding:14px;border:0;border-radius:14px}input:not([type=radio]),select,textarea{width:100%;padding:12px;background:#07182e;border:1px solid #24517c;color:#fff;margin:5px 0 10px;border-radius:14px;font:inherit}textarea{min-height:90px;resize:vertical}.doubtActions{display:flex;gap:8px}.doubtActions button{flex:1;padding:10px;border-radius:10px;border:1px solid #24517c;background:#0b2848;color:#fff}.status{font-size:12px;color:#75c9ff;font-weight:800}.source{font-size:12px;color:#aabbd0}.solvedDoubt{opacity:.72}.filters{display:flex;gap:6px;margin-bottom:12px}.filters button{flex:1;padding:9px;border-radius:10px;border:1px solid #24517c;background:#0b2848;color:#fff}.filters button.on{background:#ffd52e;color:#07182e;font-weight:900}nav{position:fixed;z-index:21;bottom:0;width:min(560px,100%);height:76px;display:flex;justify-content:space-around;align-items:center;background:#061a33;border-top:1px solid #234667;padding:4px 2px}nav button{background:none;border:0;color:#aabbd0;font-size:10px;padding:4px 3px}nav button.on{color:#fff}.studyEmbed{height:calc(100dvh - 230px)}.studyEmbed iframe{width:100%;height:100%;border:0}.empty{padding:45px 20px;text-align:center;color:#aabbd0}</style></head><body><div class="app"><div class="top"><b>CONCURSO SHORTS PRF</b></div><div id="feedFilter" class="feedfilter"><button id="fp" class="on" data-mode="pending">⏳ A resolver</button><button id="fr" data-mode="resolved">✅ Resolvidas</button><button id="fa" data-mode="all">📚 Todas</button></div><main id="feed"></main><section id="subjects" class="panel hidden"><h2>📚 Matérias</h2><input id="find" placeholder="Buscar matéria"><div id="sl"></div></section><section id="stats" class="panel hidden"><h2>📊 Desempenho</h2><div class="grid"><div class="card metric"><strong id="an">0</strong>respondidas</div><div class="card metric"><strong id="ac">0</strong>acertos</div><div class="card metric"><strong id="rt">0%</strong>aproveitamento</div><div class="card metric"><strong id="fv">0</strong>favoritas</div></div><div class="card" id="bs"></div></section><section id="cycle" class="panel hidden"><h2>🔄 Ciclo de Estudos</h2><div class="card studyEmbed"><iframe src="estudos.html#cycle"></iframe></div></section><section id="reading" class="panel hidden"><h2>📖 Leitura</h2><div class="card studyEmbed"><iframe src="estudos.html#reading"></iframe></div></section><section id="doubts" class="panel hidden"><h2>❓ Dúvidas</h2><div class="card"><h3>Nova dúvida</h3><select id="doubtSubject"><option value="">Selecione a matéria</option></select><textarea id="doubtText" placeholder="Escreva sua dúvida..."></textarea><button class="primary" id="saveDoubt">Salvar dúvida</button></div><div class="filters"><button class="on" data-dfilter="pending">Pendentes</button><button data-dfilter="resolved">Resolvidas</button><button data-dfilter="all">Todas</button></div><div id="doubtList"></div></section><section id="more" class="panel hidden"><h2>☰ Mais</h2><div class="card"><h3>🎯 Simulado</h3><select id="simSelect"></select><button class="primary" id="simBtn">Começar</button></div></section><nav><button data-tab="feed" class="on">🎬<br>Shorts</button><button data-tab="subjects">📚<br>Matérias</button><button data-tab="stats">📊<br>Desempenho</button><button data-tab="cycle">🔄<br>Ciclo</button><button data-tab="reading">📖<br>Leitura</button><button data-tab="doubts">❓<br>Dúvidas</button><button data-tab="more">☰<br>Mais</button></nav></div><script>'use strict';const S=['Língua Portuguesa','Ética e Conduta Pública','Raciocínio Lógico','Direito Constitucional','Direito Administrativo','Administração','Arquivologia','Informática','Legislação relativa à PRF'],$=x=>document.getElementById(x),key=x=>String(x);let mode='pending',doubtFilter='pending',qs=[],state={answers:{},solved:{},fav:{},doubts:[]};try{let old=JSON.parse(localStorage.getItem('prf-v2')||'{}');state.answers=old.ans||{};state.fav=old.fav||{};Object.keys(state.answers).forEach(id=>state.solved[id]=true)}catch(e){}try{let v=JSON.parse(localStorage.getItem('prf-state-v21')||'{}');state.answers={...state.answers,...(v.answers||{})};state.solved={...state.solved,...(v.solved||{})};state.fav={...state.fav,...(v.fav||{})};state.doubts=Array.isArray(v.doubts)?v.doubts:[]}catch(e){}function save(){localStorage.setItem('prf-state-v21',JSON.stringify(state));localStorage.setItem('prf-v2',JSON.stringify({qs:[],ans:state.answers,fav:state.fav}))}const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'),clean=v=>String(v??'').replace(/^\s*[A-E][\)\.\-:]?\s*/i,'').trim();async function init(){let r=await fetch('questoes.json?v=22',{cache:'no-store'}),d=await r.json();qs=d.questions||[];$('doubtSubject').innerHTML='<option value="">Selecione a matéria</option>'+S.map(s=>`<option>${s}</option>`).join('');render();more()}function list(){return mode==='pending'?qs.filter(q=>!state.solved[key(q.id)]):mode==='resolved'?qs.filter(q=>state.solved[key(q.id)]):qs}function render(custom){let a=custom||list();$('feed').innerHTML=a.length?a.map(q=>{let id=key(q.id),sel=state.answers[id]||'',right=String(q.r||'').trim().charAt(0).toUpperCase(),done=!!state.solved[id],opts=(q.o||[]).map((o,i)=>{let l=String.fromCharCode(65+i);return `<div class="choice ${l===right?'correct':''}"><input type="radio" name="q_${id}" value="${l}" ${sel===l?'checked':''} ${done?'disabled':''}><label class="opt"><span class="letter">${l}) </span>${esc(clean(o))}</label></div>`}).join('');let ri='ABCDE'.indexOf(right),answer=ri>=0&&q.o?clean(q.o[ri]):q.r;return `<article class="q ${done?'answered':''}" data-id="${id}"><span class="tag">${esc(q.s)}</span><div class="topic">${esc(q.t)}</div><h1>${esc(q.q)}</h1>${opts}<button class="resolve" type="button">Resolver e mostrar comentários</button><div class="feedback"><b>Resposta correta: ${esc(answer)}</b><br><br><b>Comentário:</b> ${esc(q.e)}</div><button class="star" data-fav type="button">${state.fav[id]?'★ Favorita':'☆ Favoritar'}</button><button class="doubtBtn" data-question-doubt type="button">❓ Anotar dúvida desta questão</button></article>`}).join(''):'<div class="empty">Nenhuma questão nesta aba.</div>'}function setMode(m){mode=m;['fp','fr','fa'].forEach(x=>$(x).classList.remove('on'));$(m==='pending'?'fp':m==='resolved'?'fr':'fa').classList.add('on');render();scrollTo(0,0)}$('feedFilter').onclick=e=>{let b=e.target.closest('[data-mode]');if(b)setMode(b.dataset.mode)};$('feed').addEventListener('change',e=>{if(e.target.type!=='radio')return;let c=e.target.closest('.q');state.answers[key(c.dataset.id)]=e.target.value;save()});$('feed').addEventListener('click',e=>{let c=e.target.closest('.q');if(!c)return;let id=key(c.dataset.id),q=qs.find(x=>key(x.id)===id);if(e.target.closest('.resolve')){let r=c.querySelector('input[type=radio]:checked');if(!r){alert('Marque uma alternativa primeiro.');return}state.answers[id]=r.value;state.solved[id]=true;save();c.classList.add('answered');c.querySelectorAll('input[type=radio]').forEach(x=>x.disabled=true);stats();return}if(e.target.closest('[data-fav]')){state.fav[id]=!state.fav[id];save();e.target.closest('[data-fav]').textContent=state.fav[id]?'★ Favorita':'☆ Favoritar';return}if(e.target.closest('[data-question-doubt]')&&q){tab('doubts');$('doubtSubject').value=q.s||'';$('doubtText').value='';$('doubtText').dataset.qid=id;$('doubtText').dataset.source='Questão: '+String(q.q||'').slice(0,180);$('doubtText').focus()}});document.querySelector('nav').onclick=e=>{let b=e.target.closest('[data-tab]');if(b)tab(b.dataset.tab)};function tab(n){$('feedFilter').style.display=n==='feed'?'flex':'none';document.querySelectorAll('main,section').forEach(x=>x.classList.add('hidden'));$(n).classList.remove('hidden');document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.tab===n));if(n==='feed')render();if(n==='subjects')subjects();if(n==='stats')stats();if(n==='doubts')renderDoubts();if(n==='more')more();scrollTo(0,0)}function subjects(){$('sl').innerHTML=S.map((s,i)=>{let a=qs.filter(q=>q.s===s),d=a.filter(q=>state.solved[key(q.id)]);return `<div class="card"><b>${s}</b><p>${d.length}/${a.length} resolvidas</p><button class="primary" data-sub="${i}">Estudar</button></div>`}).join('')}$('sl').onclick=e=>{let b=e.target.closest('[data-sub]');if(b){let s=S[+b.dataset.sub];tab('feed');render(qs.filter(q=>q.s===s))}};function stats(){let ids=Object.keys(state.solved).filter(id=>state.solved[id]),ok=ids.filter(id=>{let q=qs.find(x=>key(x.id)===id);return q&&state.answers[id]===String(q.r||'').trim().charAt(0).toUpperCase()});$('an').textContent=ids.length;$('ac').textContent=ok.length;$('rt').textContent=ids.length?Math.round(ok.length/ids.length*100)+'%':'0%';$('fv').textContent=Object.values(state.fav).filter(Boolean).length;$('bs').innerHTML=''}function more(){$('simSelect').innerHTML='<option value="">Todas</option>'+S.map(s=>`<option>${s}</option>`).join('')}$('simBtn').onclick=()=>{let s=$('simSelect').value,q=qs.filter(x=>!s||x.s===s).sort(()=>Math.random()-.5).slice(0,10);tab('feed');render(q)};$('saveDoubt').onclick=()=>{let text=$('doubtText').value.trim(),subject=$('doubtSubject').value;if(!text){alert('Escreva a dúvida primeiro.');return}let source=$('doubtText').dataset.source||'',qid=$('doubtText').dataset.qid||'';state.doubts.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),text,subject,source,qid,answer:'',resolved:false,created:new Date().toISOString()});save();$('doubtText').value='';$('doubtText').dataset.source='';$('doubtText').dataset.qid='';renderDoubts()};document.querySelector('.filters').onclick=e=>{let b=e.target.closest('[data-dfilter]');if(!b)return;doubtFilter=b.dataset.dfilter;document.querySelectorAll('[data-dfilter]').forEach(x=>x.classList.toggle('on',x.dataset.dfilter===doubtFilter));renderDoubts()};function renderDoubts(){let a=state.doubts.filter(d=>doubtFilter==='all'||(doubtFilter==='resolved'?d.resolved:!d.resolved));$('doubtList').innerHTML=a.length?a.map(d=>`<div class="card ${d.resolved?'solvedDoubt':''}" data-did="${esc(d.id)}"><div class="status">${d.resolved?'✓ RESOLVIDA':'● PENDENTE'}${d.subject?' • '+esc(d.subject):''}</div><h3>${esc(d.text)}</h3>${d.source?`<div class="source">${esc(d.source)}</div>`:''}<textarea data-danswer placeholder="Anote aqui a resposta/conclusão...">${esc(d.answer||'')}</textarea><div class="doubtActions"><button data-save-answer>Salvar anotação</button><button data-toggle-doubt>${d.resolved?'Reabrir':'✓ Marcar resolvida'}</button><button data-delete-doubt>Excluir</button></div></div>`).join(''):'<div class="empty">Nenhuma dúvida nesta lista.</div>'}$('doubtList').onclick=e=>{let card=e.target.closest('[data-did]');if(!card)return;let d=state.doubts.find(x=>x.id===card.dataset.did);if(!d)return;if(e.target.closest('[data-save-answer]')){d.answer=card.querySelector('[data-danswer]').value.trim();save();return}if(e.target.closest('[data-toggle-doubt]')){d.answer=card.querySelector('[data-danswer]').value.trim();d.resolved=!d.resolved;save();renderDoubts();return}if(e.target.closest('[data-delete-doubt]')){state.doubts=state.doubts.filter(x=>x.id!==d.id);save();renderDoubts()}};init();</script></body></html>
