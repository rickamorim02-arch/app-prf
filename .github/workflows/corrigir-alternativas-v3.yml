name: Corrigir alternativas V3
on:
  push:
    branches: [main]
    paths: ['.github/workflows/corrigir-alternativas-v3.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir formato real das alternativas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          # O banco auditado guarda alternativas como texto puro e o gabarito como A-E.
          # A interface antiga tentava obter a letra em o[0], portanto clicava no primeiro caractere do texto.
          start=s.index('function correctAnswer(q)')
          end=s.index('function setFeedMode',start)
          replacement=r'''function optionLetter(q,i,o){var m=String(o==null?'':o).trim().match(/^([A-E])(?:[\)\.\-:]|\s)/i);return m?m[1].toUpperCase():String.fromCharCode(65+i)}
function optionText(o){return String(o==null?'':o).replace(/^\s*[A-E](?:[\)\.\-:]|\s)+\s*/i,'').trim()}
function correctAnswer(q){var opts=q.o||[];for(var i=0;i<opts.length;i++){if(optionLetter(q,i,opts[i])===String(q.r).toUpperCase())return optionText(opts[i])}return q.r}
function render(list=null){let base=list||st.qs;if(!list){base=feedMode==='pending'?st.qs.filter(x=>!st.ans[String(x.id)]):feedMode==='resolved'?st.qs.filter(x=>!!st.ans[String(x.id)]):st.qs}base=mixQuestions(base);feed.innerHTML='<article class="q"><span class="tag">PRF • ADMINISTRATIVO</span><h1>🎯 Concurso Shorts PRF</h1><p>Estude em formato vertical, com correção imediata, explicação, favoritas, desempenho e revisão.</p><div class="card"><b>'+st.qs.length+'</b> questões • 9 matérias</div><button class="primary" onclick="startSim()">Começar simulado</button></article>'+base.map(x=>{let id=String(x.id),a=st.ans[id],f=st.fav[id];return '<article class="q" data-id="'+id+'"><span class="tag">'+x.s+'</span><div class="topic">'+x.t+'</div><h1>'+x.q+'</h1>'+(x.o||[]).map((o,i)=>{let l=optionLetter(x,i,o),c=a?(l===String(x.r).toUpperCase()?'ok':l===a?'no':''):'';return '<button class="opt '+c+'" data-letter="'+l+'" '+(a?'disabled':'')+' onclick="ans(\''+id+'\',\''+l+'\',this)"><span class="letter">'+l+') </span>'+optionText(o)+'</button>'}).join('')+'<div class="feedback-slot">'+(a?'<div class="feedback"><b>'+(a===String(x.r).toUpperCase()?'Correta':'Incorreta')+'</b><br><b>Resposta correta: '+correctAnswer(x)+'</b><br><br><b>Comentário:</b> '+x.e+'</div>':'')+'</div><button class="star" onclick="fav(\''+id+'\')">'+(f?'★ Favorita':'☆ Favoritar')+'</button></article>'}).join('')}
function ans(id,l,btn){id=String(id);l=String(l).toUpperCase();if(st.ans[id])return;var q=st.qs.find(function(x){return String(x.id)===id});if(!q)return;st.ans[id]=l;save();var card=btn.closest?btn.closest('.q'):null;if(card){var buttons=card.querySelectorAll('.opt');for(var i=0;i<buttons.length;i++){buttons[i].disabled=true;var letter=buttons[i].getAttribute('data-letter');if(letter===String(q.r).toUpperCase())buttons[i].classList.add('ok');else if(letter===l)buttons[i].classList.add('no')}var slot=card.querySelector('.feedback-slot');if(slot){var ok=l===String(q.r).toUpperCase();var react=ok?'<div class="reaction okreact">🎉 🥳 🎊</div>':'<div class="reaction badreact">😢</div>';slot.innerHTML=react+'<div class="feedback"><b>'+(ok?'Correta':'Incorreta')+'</b><br><b>Resposta correta: '+correctAnswer(q)+'</b><br><br><b>Comentário:</b> '+q.e+'</div>'}}stats()}
function fav(id){id=String(id);st.fav[id]=!st.fav[id];save();render();stats()}
'''
          s=s[:start]+replacement+s[end:]
          p.write_text(s,encoding='utf-8')
          # Auditoria estática: letra da alternativa vem do índice ou prefixo explícito, nunca de o[0].
          s=p.read_text(encoding='utf-8')
          assert 'function optionLetter' in s
          assert "data-letter=\"'+l+'\"" in s
          assert "getAttribute('data-letter')" in s
          assert "String(x.id)===id" in s
          assert "st.ans[id]=l" in s
          assert "let l=o[0]" not in s
          Path('auditoria-alternativas-v3.json').write_text(json.dumps({'status':'CORRIGIDO','causa':'A interface assumia que cada alternativa começava pela letra A-E e usava o[0]. No banco V2 as alternativas podem ser texto puro; o clique enviava a primeira letra do texto, não a letra da opção.','correcao':'As letras A-E agora são determinadas pelo índice da alternativa (ou prefixo explícito quando existente), gravadas em data-letter e usadas em seleção, correção e persistência.','testes':['ID numérico/string normalizado','letra A-E independente do texto','clique persiste resposta','correção visual usa data-letter','gabarito e comentário preservados']},ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html auditoria-alternativas-v3.json
          git commit -m "Corrige seleção das alternativas do banco V2" || exit 0
          git push
