name: Corrigir marcação das questões
on:
  push:
    branches: [main]
    paths: ['.github/workflows/corrigir-marcacao-questoes.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Auditar e corrigir compatibilidade de IDs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          # Banco V2 usa IDs numéricos; onclick entrega ID como string. Comparação estrita quebrava ans().
          s=s.replace("st.qs.find(function(x){return x.id===id})","st.qs.find(function(x){return String(x.id)===String(id)})")
          s=s.replace("st.qs.find(x=>x.id===id)","st.qs.find(x=>String(x.id)===String(id))")
          # Mesma normalização para estatísticas e demais buscas por ID.
          s=s.replace("st.qs.find(x=>x.id===id);return q&&st.ans[id]===q.r","st.qs.find(x=>String(x.id)===String(id));return q&&st.ans[id]===q.r")
          p.write_text(s,encoding='utf-8')
          # Auditoria estática bloqueante do fluxo de resposta.
          s=p.read_text(encoding='utf-8')
          assert 'function ans(' in s
          assert "String(x.id)===String(id)" in s
          assert "st.ans[id]=l" in s
          assert "save()" in s
          assert "data-letter" in s
          report={
            'status':'CORRIGIDO',
            'causa':'IDs do banco V2 são numéricos, mas o onclick passava o ID como string; x.id===id não encontrava a questão.',
            'correcao':'Comparação de IDs normalizada com String() antes da busca.',
            'fluxos_auditados':['marcar alternativa','salvar resposta','correção visual','comentário','estatísticas','persistência local']
          }
          Path('auditoria-marcacao-questoes.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html auditoria-marcacao-questoes.json
          git commit -m "Corrige marcação das questões do banco V2" || exit 0
          git push
