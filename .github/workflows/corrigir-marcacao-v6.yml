name: Corrigir marcacao V6
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/corrigir-marcacao-v6.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("let feedMode='pending';let st=JSON.parse(localStorage.getItem('prf-v2')||'null')||{qs:[],ans:{},fav:{},bankVersion:0};", "let feedMode='pending';let st=JSON.parse(localStorage.getItem('prf-v2')||'null')||{qs:[],ans:{},fav:{},bankVersion:0};if(localStorage.getItem('prf-answer-schema')!=='6'){st.ans={};localStorage.setItem('prf-answer-schema','6');localStorage.setItem('prf-v2',JSON.stringify(st));}")
          s=s.replace("'+o.slice(3)+'</button>'", "'+String(o).replace(/^\\s*[A-E][\\)\\.\\-:]?\\s*/i,'')+'</button>'")
          s=s.replace("function correctAnswer(q){var o=(q.o||[]).find(function(v){return String(v).trim().charAt(0)===q.r});return o?String(o).replace(/^[A-E][\\)\\.\\-:]?\\s*/,''):q.r}", "function correctAnswer(q){var i='ABCDE'.indexOf(String(q.r).toUpperCase());return i>=0&&q.o&&q.o[i]!=null?String(q.o[i]).replace(/^\\s*[A-E][\\)\\.\\-:]?\\s*/i,''):q.r}")
          assert "o.slice(3)" not in s
          assert "prf-answer-schema" in s
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Corrige marcacao das questoes V6" || exit 0
          git push
