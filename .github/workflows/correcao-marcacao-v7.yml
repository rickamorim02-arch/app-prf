name: Correcao marcacao V7
'on':
  push:
    branches:
      - main
    paths:
      - .github/workflows/correcao-marcacao-v7.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir marcacao
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="if(localStorage.getItem('prf-answer-schema')!=='6'){st.ans={};localStorage.setItem('prf-answer-schema','6');localStorage.setItem('prf-v2',JSON.stringify(st));}"
          new="if(localStorage.getItem('prf-answer-schema')!=='7'){st.ans={};localStorage.setItem('prf-answer-schema','7');localStorage.setItem('prf-v2',JSON.stringify(st));}"
          if old in s:
              s=s.replace(old,new)
          elif "prf-answer-schema')!=='7'" not in s:
              raise SystemExit('Migracao de respostas nao localizada')
          a=s.index('function ans(')
          b=s.index('function fav(',a)
          ans="""function ans(id,l,btn){id=String(id);l=String(l).toUpperCase();var q=st.qs.find(function(x){return String(x.id)===id});if(!q||st.ans[id])return;st.ans[id]=l;save();var card=btn&&btn.closest?btn.closest('.q'):null;if(!card)return;var buttons=card.querySelectorAll('.opt');for(var i=0;i<buttons.length;i++){var z=buttons[i].getAttribute('data-letter');buttons[i].disabled=true;if(z===String(q.r).toUpperCase())buttons[i].classList.add('ok');else if(z===l)buttons[i].classList.add('no')}var slot=card.querySelector('.feedback-slot');if(slot){var ok=l===String(q.r).toUpperCase();slot.innerHTML=(ok?'<div class=\"reaction okreact\">🎉 🥳 🎊</div>':'<div class=\"reaction badreact\">😢</div>')+'<div class=\"feedback\"><b>'+(ok?'Correta':'Incorreta')+'</b><br><b>Resposta correta: '+correctAnswer(q)+'</b><br><br><b>Comentário:</b> '+q.e+'</div>'}stats()}\n"""
          s=s[:a]+ans+s[b:]
          # Mantem onclick inline como fallback e adiciona delegacao robusta para Android.
          hook="""\nif(!window.__prfAnswerDelegate){window.__prfAnswerDelegate=true;document.getElementById('feed').addEventListener('click',function(ev){var btn=ev.target.closest?ev.target.closest('.opt'):null;if(!btn||btn.disabled)return;var card=btn.closest('.q');if(!card)return;ev.preventDefault();ans(card.getAttribute('data-id'),btn.getAttribute('data-letter'),btn);});}\n"""
          if 'window.__prfAnswerDelegate' not in s:
              pos=s.rfind('init();')
              if pos<0: raise SystemExit('init nao encontrado')
              s=s[:pos]+hook+s[pos:]
          if 'touch-action:manipulation' not in s:
              s=s.replace('.opt{border:1px solid #24517c;', '.opt{border:1px solid #24517c;touch-action:manipulation;cursor:pointer;')
          p.write_text(s,encoding='utf-8')
          t=p.read_text(encoding='utf-8')
          tests={
            'schema7':"prf-answer-schema')!=='7'" in t,
            'delegacao':'window.__prfAnswerDelegate' in t,
            'data_letter':'data-letter' in t,
            'data_id':'data-id' in t,
            'persistencia':'st.ans[id]=l;save()' in t,
            'touch':'touch-action:manipulation' in t,
            'sem_slice':'o.slice(3)' not in t
          }
          if not all(tests.values()): raise SystemExit(str(tests))
          Path('auditoria-marcacao-v7.json').write_text(json.dumps({'status':'APROVADO','testes':tests},ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(tests))
          PY
      - name: Validar JavaScript
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m: raise SystemExit('script nao encontrado')
          Path('/tmp/prf.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/prf.js
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html auditoria-marcacao-v7.json
          if git diff --cached --quiet; then
            echo "Sem alteracoes"
          else
            git commit -m "Corrige marcacao das alternativas V7"
            git push
          fi
