name: Leitura interna no aplicativo
on:
  push:
    branches: [main]
    paths: ['.github/workflows/leitura-interna.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  leitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Criar leitor interno
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('estudos.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('.back{color:#75c9ff;text-decoration:none}.hidden{display:none}', '.back{color:#75c9ff;text-decoration:none}.hidden{display:none}.reader{position:fixed;inset:0;z-index:20;background:#020b17;display:none;flex-direction:column}.reader.on{display:flex}.readerbar{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#061a33;border-bottom:1px solid #234667}.readerbar b{flex:1}.readerbar button{border:0;border-radius:10px;padding:10px 13px;background:#ffd52e;color:#07182e;font-weight:900}.reader iframe{border:0;width:100%;flex:1;background:#fff}')
          s=s.replace('</main></div><script>', '</main><div id="reader" class="reader"><div class="readerbar"><button onclick="closeReader()">← Voltar</button><b id="readerTitle">Leitura</b></div><iframe id="readerFrame" title="Leitor de resumo PDF"></iframe></div></div><script>')
          s=s.replace("function state(k){return prog[k]||'todo'}", "function openReader(file,title,k){document.getElementById('readerTitle').textContent=title;document.getElementById('readerFrame').src=file+'#toolbar=0&navpanes=0&view=FitH';document.getElementById('reader').classList.add('on');document.body.style.overflow='hidden';if(state(k)==='todo')setState(k,'doing')}function closeReader(){document.getElementById('reader').classList.remove('on');document.getElementById('readerFrame').src='';document.body.style.overflow=''}\nfunction state(k){return prog[k]||'todo'}")
          import re
          s=re.sub(r'<a class="open" href="\'+next\.file\+'" target="_blank" onclick="if\(state\(\'+JSON\.stringify\(next\.k\)\+'\)===\\\'todo\\\'\)setState\(\'+JSON\.stringify\(next\.k\)\+',\\\'doing\\\'\)">Ler</a>', '<button class="open" onclick="openReader(next.file,\'Aula \'+pad(next.n)+\' • \'+next.s,next.k)">Ler</button>', s)
          old="'<a class=\"open\" href=\"'+l.file+'\" target=\"_blank\" onclick=\"if(state('+JSON.stringify(l.k)+')===\\'todo\\')setState('+JSON.stringify(l.k)+',\\'doing\\')\">PDF</a>'"
          new="'<button class=\"open\" onclick=\"openReader('+JSON.stringify(l.file)+','+JSON.stringify('Aula '+pad(l.n)+' • '+l.s)+','+JSON.stringify(l.k)+')\">Ler</button>'"
          s=s.replace(old,new)
          # Fallback replacements for literal generated JS fragments
          s=s.replace("<a class=\"open\" href=\"'+l.file+'\" target=\"_blank\" onclick=\"if(state('+JSON.stringify(l.k)+')===\\'todo\\')setState('+JSON.stringify(l.k)+',\\'doing\\')\">PDF</a>", "<button class=\"open\" onclick=\"openReader('+JSON.stringify(l.file)+','+JSON.stringify('Aula '+pad(l.n)+' • '+l.s)+','+JSON.stringify(l.k)+')\">Ler</button>")
          s=s.replace("<a class=\"open\" href=\"'+next.file+'\" target=\"_blank\" onclick=\"if(state('+JSON.stringify(next.k)+')===\\'todo\\')setState('+JSON.stringify(next.k)+',\\'doing\\')\">Ler</a>", "<button class=\"open\" onclick=\"openReader('+JSON.stringify(next.file)+','+JSON.stringify('Aula '+pad(next.n)+' • '+next.s)+','+JSON.stringify(next.k)+')\">Ler</button>")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estudos.html
          if git diff --cached --quiet; then echo "Leitor já integrado."; else git commit -m "Abre resumos no leitor interno do aplicativo" && git push; fi
