name: Importar banco PRF auditado V2
on:
  push:
    branches: [main]
    paths:
      - 'questoes-prf-3000-auditado-v2.zip'
      - '.github/workflows/importar-banco-auditado-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Auditar, corrigir duplicatas e importar
        run: |
          rm -rf /tmp/prf-v2 && mkdir -p /tmp/prf-v2
          unzip -o questoes-prf-3000-auditado-v2.zip -d /tmp/prf-v2
          python3 - <<'PY'
          import json,re,shutil,unicodedata
          p='/tmp/prf-v2/questoes-prf-3000-auditado-v2.json'
          d=json.load(open(p,encoding='utf-8')); q=d.get('questions',[])
          assert len(q)==3000, f'Esperadas 3000, encontradas {len(q)}'
          def norm(s):
              s=unicodedata.normalize('NFKD',str(s)).encode('ascii','ignore').decode().lower()
              return re.sub(r'[^a-z0-9]+',' ',s).strip()
          # A validação anterior produzia falso positivo: [^a-z] apagava letras acentuadas
          # antes de normalizá-las. Agora normalizamos Unicode primeiro.
          groups={}
          for i,x in enumerate(q): groups.setdefault(norm(x.get('q','')),[]).append(i)
          dup={k:v for k,v in groups.items() if k and len(v)>1}
          exact={}
          for i,x in enumerate(q): exact.setdefault(str(x.get('q','')).strip().casefold(),[]).append(i)
          exactdup={k:v for k,v in exact.items() if k and len(v)>1}
          if dup:
              print('Duplicatas semânticas reais:',len(dup))
              for k,v in list(dup.items())[:30]: print(k[:160],v)
              raise SystemExit('Banco bloqueado: há enunciados realmente duplicados; não publicar automaticamente.')
          assert not exactdup
          generic=[]; short=[]; badanswer=[]; leaked=[]; nosource=[]
          for x in q:
              e=str(x.get('e','')).strip()
              if not e or e=='Gabarito conforme o material original.': generic.append(x.get('id'))
              if len(e)<30: short.append(x.get('id'))
              if not x.get('source_pdf') or not x.get('source_package'): nosource.append(x.get('id'))
              letters={str(o).strip()[0].upper() for o in x.get('o',[]) if str(o).strip()}
              if x.get('r') not in letters: badanswer.append((x.get('id'),x.get('r'),sorted(letters)))
              if re.search(r'coment[aá]rios?\s*:',x.get('q',''),re.I): leaked.append(x.get('id'))
          assert not generic, ('comentarios genericos',generic[:20])
          assert not short, ('comentarios curtos',short[:20])
          assert not nosource, ('sem fonte',nosource[:20])
          assert not badanswer, ('gabarito incompatível',badanswer[:20])
          assert not leaked, ('comentario no enunciado',leaked[:20])
          # renumera IDs sem alterar conteúdo de fonte
          for i,x in enumerate(q,1): x['id']=i
          d['questions']=q
          with open('questoes.json','w',encoding='utf-8') as f: json.dump(d,f,ensure_ascii=False,separators=(',',':'))
          audit={
            'status':'APROVADO','questoes':len(q),'duplicatas_normalizadas':0,'duplicatas_exatas':0,
            'comentarios_genericos':0,'comentarios_menores_30':0,'gabaritos_incompativeis':0,
            'sem_fonte':0,'comentario_vazado_enunciado':0,
            'nota':'Normalização Unicode corrigida: acentos são transliterados antes da comparação.'
          }
          with open('auditoria-prf-3000-v2.json','w',encoding='utf-8') as f: json.dump(audit,f,ensure_ascii=False,indent=2)
          print('APROVADO:',json.dumps(audit,ensure_ascii=False))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add questoes.json auditoria-prf-3000-v2.json
          git commit -m "Publica banco PRF reanalisado com comentários completos" || exit 0
          git push
