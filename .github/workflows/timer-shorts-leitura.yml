name: Timer somente Shorts e Leitura
on:
  push:
    branches: [main]
    paths: ['.github/workflows/timer-shorts-leitura.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar timer por aba
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          old="if(n==='feed')startStudyTimer();else pauseStudyTimer();"
          new="let timer=document.getElementById('studyTimer');let timerTab=(n==='feed'||n==='reading');if(timer)timer.style.display=timerTab?'block':'none';if(timerTab)startStudyTimer();else pauseStudyTimer();"
          if old not in s: raise SystemExit('Trecho do timer não encontrado')
          s=s.replace(old,new)
          # Timer começa visível porque a tela inicial é Shorts.
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "Sem alterações"; else git commit -m "Mantém timer apenas em Shorts e Leitura" && git push; fi
