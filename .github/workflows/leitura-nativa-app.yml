name: Leitura nativa no app
on:
  push:
    branches: [main]
    paths: ['.github/workflows/leitura-nativa-app.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tornar leitura parte da tela principal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          old='<section id="reading" class="panel hidden"><h2>📖 Leitura</h2><div class="card"><p>Biblioteca dos resumos em PDF, separada do controle do ciclo.</p><div class="studyEmbed"><iframe src="estudos.html#reading" title="Leitura"></iframe></div></div></section>'
          new='''<section id="reading" class="panel hidden"><h2>📖 Leitura</h2><p>Resumos das aulas sem sair do aplicativo.</p><input id="readSearch" placeholder="Buscar disciplina ou aula" oninput="renderNativeReading()"><div id="nativeReading"></div></section><div id="nativeReader" class="nativeReader"><div class="nativeReaderBar"><button onclick="closeNativeReader()">← Voltar</button><b id="nativeReaderTitle">Leitura</b></div><iframe id="nativeReaderFrame" title="Leitura da aula"></iframe></div>'''
          if old not in s: raise SystemExit('Bloco Leitura esperado não encontrado')
          s=s.replace(old,new)
          s=s.replace('</style></head>', '.nativeReader{position:fixed;z-index:30;inset:0;background:#020b17;display:none;flex-direction:column}.nativeReader.on{display:flex}.nativeReaderBar{height:58px;display:flex;align-items:center;gap:10px;padding:8px 12px;background:#061a33;border-bottom:1px solid #234667}.nativeReaderBar b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nativeReaderBar button{border:0;border-radius:10px;padding:10px 12px;background:#ffd52e;color:#07182e;font-weight:900}.nativeReader iframe{width:100%;flex:1;border:0;background:white}.readLesson{display:flex;gap:10px;align-items:center;border-top:1px solid #24517c;padding:10px 0}.readLesson .ri{flex:1}.readLesson small{color:#aabbd0}</style></head>')
          marker="const S=['Língua Portuguesa'"
          insert="""const READ_BASE='prf-leitura-pdfs/prf-leitura-pdfs/';const READ_DATA=[['Português',0,14],['Raciocínio Lógico-Matemática',0,19],['Informática',0,9],['Direito Constitucional',0,13],['Direito Administrativo',0,16],['Noções de Administração',0,16],['Legislação Relativa à Polícia Rodoviária Federal',1,2],['Ética e Conduta Pública',0,2],['Arquivologia',0,8]];
function readPad(n){return String(n).padStart(2,'0')}function readFile(s,n){return READ_BASE+encodeURIComponent(s)+'/Aula%20'+readPad(n)+'.pdf'}
function renderNativeReading(){let el=document.getElementById('nativeReading');if(!el)return;let q=((document.getElementById('readSearch')||{}).value||'').toLowerCase();el.innerHTML=READ_DATA.map(d=>{let rows=[];for(let n=d[1];n<=d[2];n++){if((d[0]+' aula '+readPad(n)).toLowerCase().includes(q))rows.push('<div class=\"readLesson\"><div class=\"ri\"><b>Aula '+readPad(n)+'</b><br><small>'+d[0]+'</small></div><button class=\"primary\" style=\"width:auto;padding:10px 14px\" onclick=\'openNativeReader('+JSON.stringify(d[0])+','+n+')\'>Ler</button></div>')}return rows.length?'<div class=\"card\"><b>'+d[0]+'</b>'+rows.join('')+'</div>':''}).join('')}
function openNativeReader(s,n){document.getElementById('nativeReaderTitle').textContent='Aula '+readPad(n)+' • '+s;document.getElementById('nativeReaderFrame').src=readFile(s,n)+'#toolbar=0&navpanes=0&view=FitH';document.getElementById('nativeReader').classList.add('on')}
function closeNativeReader(){document.getElementById('nativeReader').classList.remove('on');document.getElementById('nativeReaderFrame').src='about:blank'}
"""+marker
          s=s.replace(marker,insert)
          s=s.replace("if(n==='subjects')subjects();if(n==='stats')stats();if(n==='more')more()", "if(n==='subjects')subjects();if(n==='stats')stats();if(n==='reading')renderNativeReading();if(n==='more')more()")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "Já corrigido"; else git commit -m "Integra Leitura diretamente na tela principal" && git push; fi
