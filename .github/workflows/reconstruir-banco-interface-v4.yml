name: Reconstruir banco e interface V4
on:
  push:
    branches: [main]
    paths: ['.github/workflows/reconstruir-banco-interface-v4.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sanear banco e corrigir interface
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          bp=Path('questoes.json'); d=json.loads(bp.read_text(encoding='utf-8')); qs=d['questions']
          changed=0; contaminated=0
          for q in qs:
              opts=[str(x).strip() for x in q.get('o',[])]
              # Recupera comentário que foi anexado a uma alternativa durante extração.
              clean=[]; recovered=[]
              for o in opts:
                  m=re.search(r'\s+Coment[aá]rio\s*:\s*',o,re.I)
                  if m:
                      contaminated+=1
                      before=o[:m.start()].rstrip(); after=o[m.end():].strip()
                      if before: clean.append(before)
                      if after: recovered.append(after)
                  else: clean.append(o)
              # Tudo depois das alternativas válidas A-E que parece explicação também pertence ao comentário.
              valid=[]
              for o in clean:
                  if len(valid)<5:
                      valid.append(o)
                  else: recovered.append(o)
              if recovered:
                  old=str(q.get('e','')).strip()
                  rec=' '.join(recovered).strip()
                  if rec and rec not in old: q['e']=(rec+' '+old).strip()
                  q['o']=valid; changed+=1
              # Remove prefixo A-E apenas quando presente; interface gera letras pelo índice.
              q['o']=[re.sub(r'^\s*[A-E][\)\.\-:]\s*','',str(o),flags=re.I).strip() for o in q.get('o',[])]
          bp.write_text(json.dumps(d,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          # Auditoria bloqueante de estrutura.
          bad=[q['id'] for q in qs if any(re.search(r'Coment[aá]rio\s*:',str(o),re.I) for o in q.get('o',[]))]
          assert not bad, ('comentario ainda em alternativa',bad[:20])
          assert all(2<=len(q.get('o',[]))<=5 for q in qs), 'Quantidade inválida de alternativas'
          # Corrige interface diretamente, sem depender de workflow anterior.
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          a=s.index('function correctAnswer(q)'); b=s.index('function setFeedMode',a)
          block=r'''function optionLetter(i){return String.fromCharCode(65+i)}
function optionText(o){return String(o==null?'':o).replace(/^\s*[A-E][\)\.\-:]\s*/i,'').trim()}
function correctAnswer(q){var i='ABCDE'.indexOf(String(q.r).toUpperCase());return i>=0&&q.o&&q.o[i]!=null?optionText(q.o[i]):q.r}
function render(list=null){let base=list||st.qs;if(!list){base=feedMode==='pending'?st.qs.filter(x=>!st.ans[String(x.id)]):feedMode==='resolved'?st.qs.filter(x=>!!st.ans[String(x.id)]):st.qs}base=mixQuestions(base);feed.innerHTML='<article class="q"><span class="tag">PRF • ADMINISTRATIVO</span><h1>🎯 Concurso Shorts PRF</h1><p>Estude em formato vertical, com correção imediata, explicação, favoritas, desempenho e revisão.</p><div class="card"><b>'+st.qs.length+'</b> questões • 9 matérias</div><button class="primary" onclick="startSim()">Começar simulado</button></article>'+base.map(x=>{let id=String(x.id),a=st.ans[id],f=st.fav[id];return '<article class="q" data-id="'+id+'"><span class="tag">'+x.s+'</span><div class="topic">'+x.t+'</div><h1>'+x.q+'</h1>'+(x.o||[]).map((o,i)=>{let l=optionLetter(i),c=a?(l===String(x.r).toUpperCase()?'ok':l===a?'no':''):'';return '<button type="button" class="opt '+c+'" data-letter="'+l+'" '+(a?'disabled':'')+' onclick="ans(\''+id+'\',\''+l+'\',this)"><span class="letter">'+l+') </span>'+optionText(o)+'</button>'}).join('')+'<div class="feedback-slot">'+(a?'<div class="feedback"><b>'+(a===String(x.r).toUpperCase()?'Correta':'Incorreta')+'</b><br><b>Resposta correta: '+correctAnswer(x)+'</b><br><br><b>Comentário:</b> '+x.e+'</div>':'')+'</div><button class="star" onclick="fav(\''+id+'\')">'+(f?'★ Favorita':'☆ Favoritar')+'</button></article>'}).join('')}
function ans(id,l,btn){id=String(id);l=String(l).toUpperCase();if(st.ans[id])return;var q=st.qs.find(function(x){return String(x.id)===id});if(!q)return;st.ans[id]=l;save();var card=btn.closest('.q');if(card){card.querySelectorAll('.opt').forEach(function(b){b.disabled=true;var z=b.dataset.letter;if(z===String(q.r).toUpperCase())b.classList.add('ok');else if(z===l)b.classList.add('no')});var slot=card.querySelector('.feedback-slot');if(slot){var ok=l===String(q.r).toUpperCase();slot.innerHTML=(ok?'<div class="reaction okreact">🎉 🥳 🎊</div>':'<div class="reaction badreact">😢</div>')+'<div class="feedback"><b>'+(ok?'Correta':'Incorreta')+'</b><br><b>Resposta correta: '+correctAnswer(q)+'</b><br><br><b>Comentário:</b> '+q.e+'</div>'}}stats()}
function fav(id){id=String(id);st.fav[id]=!st.fav[id];save();render();stats()}
'''
          s=s[:a]+block+s[b:]
          p.write_text(s,encoding='utf-8')
          # valida JS estrutural e banco
          s=p.read_text(encoding='utf-8')
          assert "let l=o[0]" not in s
          assert "data-letter=\"'+l+'\"" in s
          assert "btn.closest('.q')" in s
          report={'status':'CORRIGIDO','questoes':len(qs),'questoes_com_conteudo_recuperado':changed,'ocorrencias_comentario_em_alternativa':contaminated,'comentario_em_alternativa_apos_correcao':0,'marcacao':'letras A-E geradas pelo indice e clique via data-letter'}
          Path('auditoria-integracao-v4.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html questoes.json auditoria-integracao-v4.json
          git commit -m "Saneia alternativas comentarios e corrige marcacao" || exit 0
          git push
