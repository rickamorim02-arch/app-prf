name: Corrigir toque alternativas V8
'on':
  push:
    branches:
      - main
    paths:
      - .github/workflows/corrigir-toque-alternativas-v8.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir toque e selecao de texto
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Impede o Android de tratar a alternativa como texto selecionavel/copiar.
          css=".opt,.opt *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.opt{touch-action:manipulation;cursor:pointer;position:relative;z-index:5;min-height:48px}"
          if css not in s:
              s=s.replace('</style>',css+'</style>',1)
          # Migra uma vez o estado legado para liberar botoes bloqueados.
          s=s.replace("if(localStorage.getItem('prf-answer-schema')!=='7'){st.ans={};localStorage.setItem('prf-answer-schema','7');localStorage.setItem('prf-v2',JSON.stringify(st));}","if(localStorage.getItem('prf-answer-schema')!=='8'){st.ans={};localStorage.setItem('prf-answer-schema','8');localStorage.setItem('prf-v2',JSON.stringify(st));}")
          # Handler central robusto. pointerup cobre toque Android e mouse sem depender de onclick inline.
          hook="""
(function(){
 var f=document.getElementById('feed');
 if(!f)return;
 function pick(ev){
   var t=ev.target;
   var b=t&&t.closest?t.closest('button.opt'):null;
   if(!b||b.disabled||!f.contains(b))return;
   ev.preventDefault();
   ev.stopPropagation();
   var c=b.closest('.q');
   if(!c)return;
   ans(String(c.getAttribute('data-id')),String(b.getAttribute('data-letter')),b);
 }
 f.addEventListener('pointerup',pick,{passive:false});
 f.addEventListener('contextmenu',function(ev){if(ev.target&&ev.target.closest&&ev.target.closest('.opt'))ev.preventDefault()});
})();
"""
          # Remove hook V8 anterior se houver e injeta imediatamente antes de init.
          s=re.sub(r'/\* PRF_V8_TOUCH_BEGIN \*/.*?/\* PRF_V8_TOUCH_END \*/\s*','',s,flags=re.S)
          wrapped='/* PRF_V8_TOUCH_BEGIN */\n'+hook+'/* PRF_V8_TOUCH_END */\n'
          pos=s.rfind('init();')
          if pos<0: raise SystemExit('init() nao encontrado')
          s=s[:pos]+wrapped+s[pos:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validar JavaScript e requisitos
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert "prf-answer-schema')!=='8'" in s
          assert "addEventListener('pointerup',pick" in s
          assert '-webkit-user-select:none' in s
          assert "getAttribute('data-letter')" in s
          assert 'st.ans[id]=l;save()' in s
          js=re.search(r'<script>(.*)</script>',s,re.S)
          assert js, 'script principal nao encontrado'
          Path('/tmp/app.js').write_text(js.group(1),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Corrige toque e selecao das alternativas V8" || exit 0
          git push
